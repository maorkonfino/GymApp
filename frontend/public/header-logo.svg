<svg width="800" height="200" viewBox="0 0 800 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background wolf silhouette (optional decorative element) -->
  <defs>
    <linearGradient id="wolfGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#06B6D4;stop-opacity:0.1" />
      <stop offset="100%" style="stop-color:#8B5CF6;stop-opacity:0.1" />
    </linearGradient>
  </defs>
  
  <!-- Wolf silhouette behind text -->
  <path d="M100 50 L80 80 L60 100 L50 120 L45 140 L50 150 L70 155 L90 150 L100 140 L110 155 L130 150 L150 140 L155 120 L150 100 L130 80 L120 50 L100 30 Z" 
        fill="url(#wolfGradient)" opacity="0.3"/>
  
  <!-- Main BEAST Text -->
  <text x="180" y="130" font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="120" letter-spacing="8">
    <tspan fill="#FFFFFF">B</tspan>
    <tspan fill="#FFFFFF">E</tspan>
    <tspan fill="#06B6D4">A</tspan>
    <tspan fill="#FFFFFF">S</tspan>
    <tspan fill="#FFFFFF">T</tspan>
  </text>
  
  <!-- Subtitle -->
  <text x="185" y="165" font-family="Arial, Helvetica, sans-serif" font-weight="600" font-size="24" fill="#9CA3AF" letter-spacing="4">
    TRAINING
  </text>
  
  <!-- Decorative underline -->
  <line x1="185" y1="175" x2="750" y2="175" stroke="#06B6D4" stroke-width="3" opacity="0.5"/>
</svg>
